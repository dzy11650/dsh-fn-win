<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; background:#0f1115; color:#e6e6e6;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; }
    .spin { width:36px; height:36px; border:3px solid #2a2f3a; border-top-color:#4f8cff;
            border-radius:50%; animation:r 0.9s linear infinite; margin:0 auto 16px; }
    @keyframes r { to { transform:rotate(360deg); } }
    p { color:#8b93a1; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>正在启动 DeepSeek Harness 本地服务…</p>
    <p style="font-size:12px">首次启动需安装依赖，请稍候（可在托盘 → 查看日志）</p>
  </div>
</body>
</html>
